{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ note.title }}</title>
    <link href="{% static 'output.css' %}" rel="stylesheet" />
  </head>
  <body class="bg-[#f7f5f4]">
    <section class="flex justify-center items-center min-h-screen">
      <div class="max-w-5xl bg-white w-sm shadow-sm">
        <div class="p-4 bg-[#f5d177] space-y-3">
          <h1 class="font-semibold text-2xl">{{ note.title }}</h1>
          <p>{{ note.content }}</p>
          <div class="flex justify-end pt-7">
            <div class="flex flex-col items-end text-xs space-y-0.5">
              <p class="block">Created at : {{ note.created_at }}</p>
              <p class="block">Last edited : {{ note.updated_at }}</p>
            </div>
          </div>
        </div>
        <div
          class="bg-[#d8e2e8] px-4 py-1 flex justify-end items-center gap-1.5 h-[20%]"
        >
          <form
            method="post"
            action="{% url 'delete' note.id %}"
            class="cursor-pointer pt-1.5"
          >
            {% csrf_token %}
            <button class="cursor-pointer">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
              >
                <path
                  fill="currentColor"
                  d="M5 21V6H4V4h5V3h6v1h5v2h-1v15zm2-2h10V6H7zm2-2h2V8H9zm4 0h2V8h-2zM7 6v13z"
                />
              </svg>
            </button>
          </form>
          <a href="{% url 'edit' note.id %}">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
            >
              <path
                fill="currentColor"
                d="M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h8.925l-2 2H5v14h14v-6.95l2-2V19q0 .825-.587 1.413T19 21zm4-6v-4.25l9.175-9.175q.3-.3.675-.45t.75-.15q.4 0 .763.15t.662.45L22.425 3q.275.3.425.663T23 4.4t-.137.738t-.438.662L13.25 15zM21.025 4.4l-1.4-1.4zM11 13h1.4l5.8-5.8l-.7-.7l-.725-.7L11 11.575zm6.5-6.5l-.725-.7zl.7.7z"
              />
            </svg>
          </a>

          <a href="{% url 'index' %}">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="23"
              height="23"
              viewBox="0 0 24 24"
            >
              <path fill="currentColor" d="M4 21V9l8-6l8 6v12h-6v-7h-4v7z" />
            </svg>
          </a>
        </div>
      </div>
    </section>
  </body>
</html>
