{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ note.title }}</title>
    <link href="{% static 'output.css' %}" rel="stylesheet" />
  </head>
  <body>
    <h3>{{ note.title }}</h3>
    <p>{{ note.content }}</p>
    <a href="{% url 'edit' note.id %}">Edit</a>

    <form method="post" action="{% url 'delete' note.id %}">
      {% csrf_token %}
      <button>Delete</button>
    </form>
  </body>
</html>
